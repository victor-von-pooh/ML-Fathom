[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-fathom"
version = "0.1.0"
description = "機械学習に使うデータを読み込み, 分析し, 前処理して学習用に書き出すローカルの Web アプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "ml-eda[all]",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32"
]

[project.scripts]
ml-fathom = "ml_fathom.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0"
]

[tool.uv.sources]
ml-eda = { path = "../ML-EDA", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ml_fathom"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
